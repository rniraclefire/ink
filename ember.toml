[package]
name = "teamfireworks/ink"
version = "0.1.0-rc.4"
description = "Zero-hierarchy immediate-mode UI for Roblox"
authors = ["rniraclefire"]
logo = ".github/assets/brand/icon.png"
repository = "rniraclefire/ink"
license = "MIT"

[target]
environment = "roblox"
main = "src/init.luau"
includes = ["ember.lock", "ember.toml", "src", "README.md", "LICENSE"]

[tools]
luau-lsp = "johnnymorganz/luau-lsp@1.70.1"
stylua = "johnnymorganz/stylua@2.6.0"
rojo = "rojo-rbx/rojo@7.7.1"
asphalt = "jacktabscode/asphalt@2.0.2"

[scripts]
dev = ["rojo serve examples.project.json", "luaudocs dev"]
